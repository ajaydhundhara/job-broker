- id: SCHEDULER-LAUNCH-FAILURE-AFTER-FIFTEEN-MINUTES
  endpoint: POST /jobs
  category: state
  title: launch that never becomes ready is marked failed after fifteen minutes
  source: docx provider launch failure behavior
  given:
    now_ts: 0
    provider:
      launch_failure_probability: 1.0
      deterministic_launch_delay_seconds: 240
  # Rewritten (TEST_MIGRATION_MAP.md): the first never-ready failure is retried
  # at once (SPEC_DECISIONS.md #2, delay 0), so a second node is launching at 900.
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 4, estimated_minutes: 30}
    - advance: {minutes: 15}
    - request: GET /nodes
      query: {include_terminated: true}
  then:
    status: 200
    body:
      - {id: node-00001, state: failed, launched_at: 0, terminated_at: 900}
      - {id: node-00002, state: launching, launched_at: 900}
    db:
      - sql: SELECT end_reason FROM nodes WHERE id = 'node-00001'
        equals: launch_failed
      - sql: SELECT status FROM jobs
        equals: queued

- id: SCHEDULER-NEVER-READY-RETRY-BACKS-OFF
  endpoint: POST /sim/advance
  category: time
  title: the second consecutive never-ready failure waits 60 s before relaunching
  source: SPEC_DECISIONS.md #2
  # A 1-GPU job, so there is no allowed fallback type (gpu-m costs 4.5x gpu-s)
  # and only the backoff decides: fail 900 -> relaunch 900 (k=1, 0 s); fail
  # 1800 -> relaunch 1860 (k=2, 60 s), not 1800.
  given:
    now_ts: 0
    provider:
      launch_failure_probability: 1.0
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30}
    - advance: {to_ts: 1860}
  then:
    status: 200
    db:
      - sql: SELECT group_concat(id || ':' || node_type || '@' || launched_at, ',') FROM (SELECT * FROM nodes ORDER BY id)
        equals: "node-00001:gpu-s@0,node-00002:gpu-s@900,node-00003:gpu-s@1860"

