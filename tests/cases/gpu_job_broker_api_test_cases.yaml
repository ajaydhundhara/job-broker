- id: SCHEDULER-CAPACITY-UNAVAILABLE-DOES-NOT-CRASH
  endpoint: POST /jobs
  category: state
  title: provider CapacityUnavailable leaves job queued and service usable
  source: docx req 2; SPEC_DECISIONS.md #3, #4
  # Rewritten (TEST_MIGRATION_MAP.md): every type that may serve the job is
  # refused, so one capacity_unavailable event per type tried (gpu-m, then the
  # gpu-l fallback) and no node.
  given:
    now_ts: 0
    provider:
      unavailable_windows:
        gpu-m: [{from_ts: 0, to_ts: 3600}]
        gpu-l: [{from_ts: 0, to_ts: 3600}]
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 4, estimated_minutes: 30}
  then:
    status: 201
    body: {id: ANY_JOB_ID, status: queued}
    events_added: 3  # job_submitted, capacity_unavailable gpu-m, capacity_unavailable gpu-l
    db:
      - sql: SELECT COUNT(*) FROM nodes
        equals: 0
      - sql: SELECT group_concat(event_type || ':' || COALESCE(json_extract(details, '$.node_type'), ''), ',') FROM (SELECT * FROM events ORDER BY id)
        equals: "job_submitted:,capacity_unavailable:gpu-m,capacity_unavailable:gpu-l"

- id: SCHEDULER-CAPACITY-UNAVAILABLE-FALLS-BACK-TO-LARGER-TYPE
  endpoint: POST /jobs
  category: state
  title: preferred type refused, next larger type within 2x the price is launched in the same pass
  source: SPEC_DECISIONS.md #3 (policy)
  given:
    now_ts: 0
    provider:
      unavailable_windows:
        gpu-m: [{from_ts: 0, to_ts: 3600}]
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 2, estimated_minutes: 30}
  then:
    status: 201
    body: {id: ANY_JOB_ID, status: queued}
    events_added: 3
    db:
      - sql: SELECT group_concat(event_type || ':' || COALESCE(json_extract(details, '$.node_type'), ''), ',') FROM (SELECT * FROM events ORDER BY id)
        equals: "job_submitted:,capacity_unavailable:gpu-m,node_launched:gpu-l"
      - sql: SELECT entity_type || ':' || json_extract(details, '$.k') FROM events WHERE event_type = 'capacity_unavailable'
        equals: "provider:1"
      - sql: SELECT node_type || ':' || state FROM nodes
        equals: "gpu-l:launching"

