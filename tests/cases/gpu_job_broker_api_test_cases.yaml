# Shared GPU Job Broker - API conformance test cases
#
# This file uses the case DSL supplied in the request. It is a test specification,
# not a pytest test module. A runner must load this YAML and execute each case.
#
# API contract / assumptions made explicit for deterministic tests:
# - POST /jobs: 201 for a new job; 200 for an idempotent replay; 409 for key/body conflict.
# - Invalid request data: 422. Unknown job IDs: 404. Invalid lifecycle transitions: 409.
# - Job response fields: id, team, gpus, estimated_minutes, priority, status,
#   submitted_at, started_at, ended_at, wait_seconds.
# - POST /jobs/{id}/cancel and POST /jobs/{id}/complete return 200 on success.
# - GET /queue and GET /nodes return JSON arrays. Queue entries contain id, position,
#   priority, submitted_at and wait_seconds. Node entries contain id, type, team, state,
#   gpus_total, gpus_used, gpus_free, running_job_ids, idle_since and cost_so_far.
# - GET /sim/now returns {now_ts: <integer>}; POST /sim/advance returns {now_ts: <integer>}.
# - GET /reports/cost returns {from_ts, to_ts, grand_total, provider_overhead,
#   teams: [{team, gpu_hours, busy_cost, idle_cost, total_cost}]} (teams sorted by
#   name). Money values are USD rounded half-up to cents.
# - Simulated timestamps are integer seconds. Report windows are half-open [from_ts, to_ts).
#   from_ts == to_ts is rejected with 422. A job starting exactly at to_ts contributes
#   zero GPU-hours to that window.
# - Node cost is rate * billable_seconds / 3600. billable_seconds is max(actual lifetime,
#   600 seconds). To make window reports additive, the minimum billable interval is
#   [launched_at, launched_at + 600); otherwise it is [launched_at, terminated_at).
#   For a live node, billable time is clipped to the report's to_ts.
# - Node cost is attributed to its owning team. A failed launch (state=failed) is
#   attributed to provider_overhead, although the node still records an owner team. Idle time remains charged to the node's owning team.
# - GPU-hours are requested GPUs * actual running seconds / 3600, clipped to the report window.
# - Idempotency keys are trimmed and scoped by team. A repeated key with an equivalent
#   normalized request returns the original job even if that job is now cancelled.
# - Team names are non-empty strings of at most 128 characters; UTF-8 / non-ASCII is allowed.
# - estimated_minutes is a positive integer, maximum 10080 minutes (7 days). This upper
#   bound is an explicit test-policy assumption because the exercise does not specify one.
# - wait_seconds means: queued = now - submitted_at; started or completed = started_at -
#   submitted_at; cancelled before start = ended_at - submitted_at.
# - Queue ordering is priority (high, normal, low), then submitted_at, then creation
#   order (jobs.created_seq; SPEC_DECISIONS.md #6). With the default 'fair' policy the
#   team's 24 h GPU usage comes between priority and submitted_at.
# - A node may only run jobs from its owning team. Same-team jobs may share its GPUs.
# - The runner fixture extensions used below are: raw_body for non-JSON requests;
#   restart: {same_database: true}; given.config.idle_timeout_minutes; and given.provider
#   controls deterministic_launch_delay_seconds, launch_failure_probability,
#   unavailable_windows ({type: [{from_ts, to_ts}]}, half-open) and never_ready_launches
#   (SPEC_DECISIONS.md #4).
# - Node ids are sequential: node-00001, node-00002, ... (ANY_NODE_ID; decision #14). A parallel_requests step is included as an OPTIONAL
#   concurrency case; a runner may skip it if parallel execution is unsupported.
# - SQL checks assume a jobs table and an events table. Adapt SQL table/column names if the
#   implementation uses a different schema; API assertions remain applicable.

- id: JOB-SUBMIT-HAPPY-MATRIX
  endpoint: POST /jobs
  category: happy
  title: accept every supported GPU quantity and every priority
  source: docx req 1
  given:
    now_ts: 0
  base_body:
    team: vision
    estimated_minutes: 30
  table:
    - set: {gpus: 1, priority: low}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 1, priority: low, status: queued}
    - set: {gpus: 1, priority: normal}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 1, priority: normal, status: queued}
    - set: {gpus: 1, priority: high}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 1, priority: high, status: queued}
    - set: {gpus: 2, priority: low}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 2, priority: low, status: queued}
    - set: {gpus: 2, priority: normal}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 2, priority: normal, status: queued}
    - set: {gpus: 2, priority: high}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 2, priority: high, status: queued}
    - set: {gpus: 4, priority: low}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 4, priority: low, status: queued}
    - set: {gpus: 4, priority: normal}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 4, priority: normal, status: queued}
    - set: {gpus: 4, priority: high}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 4, priority: high, status: queued}
    - set: {gpus: 8, priority: low}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 8, priority: low, status: queued}
    - set: {gpus: 8, priority: normal}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 8, priority: normal, status: queued}
    - set: {gpus: 8, priority: high}
      status: 201
      body: {id: ANY_JOB_ID, gpus: 8, priority: high, status: queued}

- id: JOB-SUBMIT-DEFAULT-PRIORITY
  endpoint: POST /jobs
  category: happy
  title: omitted priority defaults to normal
  source: docx req 1
  given: {now_ts: 120}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30}
  then:
    status: 201
    body: {id: ANY_JOB_ID, priority: normal, status: queued, submitted_at: 120}
    events_added: 2  # D1: job_submitted + node_launched (scheduling runs in the request)

- id: JOB-SUBMIT-UNICODE-TEAM
  endpoint: POST /jobs
  category: happy
  title: accept a valid non-ASCII team name
  source: validation edge from checklist
  given: {now_ts: 0}
  when:
    - request: POST /jobs
      body: {team: "visión-日本", gpus: 1, estimated_minutes: 30}
  then:
    status: 201
    body: {id: ANY_JOB_ID, team: "visión-日本", status: queued}

- id: JOB-SUBMIT-GPU-VALIDATION-MATRIX
  endpoint: POST /jobs
  category: validation
  title: reject unsupported or incorrectly typed GPU counts
  source: docx req 1
  base_body: {team: vision, gpus: 1, estimated_minutes: 30}
  table:
    - set: {gpus: 0}
      status: 422
    - set: {gpus: 3}
      status: 422
    - set: {gpus: 16}
      status: 422
    - set: {gpus: -1}
      status: 422
    - set: {gpus: "4"}
      status: 422
    - set: {gpus: 4.0}
      status: 422
    - set: {gpus: true}
      status: 422
    - set: {gpus: null}
      status: 422

- id: JOB-SUBMIT-ESTIMATE-VALIDATION-MATRIX
  endpoint: POST /jobs
  category: validation
  title: reject invalid estimated duration values
  source: validation policy documented in file header
  base_body: {team: vision, gpus: 1, estimated_minutes: 30}
  table:
    - set: {estimated_minutes: 0}
      status: 422
    - set: {estimated_minutes: -1}
      status: 422
    - set: {estimated_minutes: 1000000}
      status: 422
    - set: {estimated_minutes: 10081}
      status: 422
    - set: {estimated_minutes: 30.5}
      status: 422

- id: JOB-SUBMIT-TEAM-VALIDATION-MATRIX
  endpoint: POST /jobs
  category: validation
  title: reject blank, missing, non-string and overlong team names
  source: validation policy documented in file header
  base_body: {team: vision, gpus: 1, estimated_minutes: 30}
  table:
    - set: {team: ""}
      status: 422
    - remove: [team]
      status: 422
    - set: {team: 123}
      status: 422
    - set:
        team: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      status: 422

- id: JOB-SUBMIT-PRIORITY-CASE-VALIDATION
  endpoint: POST /jobs
  category: validation
  title: reject priority with incorrect enum casing
  source: checklist priority wrong case
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30, priority: HIGH}
  then: {status: 422}

- id: JOB-SUBMIT-UNKNOWN-FIELD
  endpoint: POST /jobs
  category: validation
  title: reject an unknown request field
  source: checklist unknown field
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30, unexpected: true}
  then: {status: 422}

- id: JOB-SUBMIT-EMPTY-BODY
  endpoint: POST /jobs
  category: validation
  title: reject an empty JSON body
  when:
    - request: POST /jobs
      body: {}
  then: {status: 422}

- id: JOB-SUBMIT-NON-JSON-BODY
  endpoint: POST /jobs
  category: validation
  title: reject a body that is not valid JSON
  when:
    - request: POST /jobs
      headers: {content-type: application/json}
      raw_body: "{not-json"
  then: {status: 422}

- id: JOB-SUBMIT-IDEMPOTENT-REPLAY
  endpoint: POST /jobs
  category: idempotency
  title: same key and same normalized request returns existing job
  source: docx req 1
  given:
    now_ts: 0
    jobs:
      - {ref: A, team: vision, gpus: 2, estimated_minutes: 30, priority: normal, idempotency_key: k1}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 2, estimated_minutes: 30, priority: normal, idempotency_key: k1}
  then:
    status: 200
    body: {id: {ref: A}, status: queued}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 1
    events_added: 0

- id: JOB-SUBMIT-IDEMPOTENT-DEFAULT-EQUIVALENCE
  endpoint: POST /jobs
  category: idempotency
  title: omitted priority and explicit normal are equivalent for same key
  given:
    now_ts: 0
    jobs:
      - {ref: A, team: vision, gpus: 2, estimated_minutes: 30, idempotency_key: k1}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 2, estimated_minutes: 30, priority: normal, idempotency_key: k1}
  then:
    status: 200
    body: {id: {ref: A}, priority: normal}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 1
    events_added: 0

- id: JOB-SUBMIT-IDEMPOTENCY-CONFLICT
  endpoint: POST /jobs
  category: idempotency
  title: same key with different GPUs returns 409
  source: docx req 1
  given:
    now_ts: 0
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, idempotency_key: k1}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 2, estimated_minutes: 30, idempotency_key: k1}
  then:
    status: 409
    body: {detail: idempotency key reused with different request}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 1
    events_added: 0
    unchanged: [sim_now, queue]

- id: JOB-SUBMIT-IDEMPOTENCY-SCOPED-BY-TEAM
  endpoint: POST /jobs
  category: idempotency
  title: same key used by another team creates a separate job
  given:
    now_ts: 0
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, idempotency_key: shared-key}
  when:
    - request: POST /jobs
      body: {team: nlp, gpus: 1, estimated_minutes: 30, idempotency_key: shared-key}
  then:
    status: 201
    body: {id: ANY_JOB_ID, team: nlp, status: queued}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 2
    events_added: 2  # D1: job_submitted + node_launched (scheduling runs in the request)

- id: JOB-SUBMIT-IDEMPOTENCY-AFTER-CANCEL
  endpoint: POST /jobs
  category: idempotency
  title: replay after cancellation returns the original cancelled job
  given:
    now_ts: 100
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, idempotency_key: k1}
  when:
    - request: POST /jobs/{A}/cancel
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30, priority: normal, idempotency_key: k1}
  then:
    status: 200
    body: {id: {ref: A}, status: cancelled}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 1
    events_added: 0

- id: JOB-SUBMIT-IDEMPOTENCY-TRIM-KEY
  endpoint: POST /jobs
  category: idempotency
  title: idempotency key is trimmed before lookup
  given:
    now_ts: 0
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, idempotency_key: " k1 "}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30, idempotency_key: k1}
  then:
    status: 200
    body: {id: {ref: A}}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 1
    events_added: 0

- id: JOB-SUBMIT-WITHOUT-IDEMPOTENCY-KEY
  endpoint: POST /jobs
  category: idempotency
  title: requests without an idempotency key create separate jobs
  given: {now_ts: 0}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30}
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30}
  then:
    status: 201
    body: {id: ANY_JOB_ID, status: queued}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 2
    events_added: 2  # D1: job_submitted + node_launched (scheduling runs in the request)

- id: JOB-SUBMIT-SIDE-EFFECTS
  endpoint: POST /jobs
  category: side_effect
  title: new submission records simulated timestamp and exactly one job_submitted event
  given: {now_ts: 123456789}
  when:
    - request: POST /jobs
      body: {team: vision, gpus: 1, estimated_minutes: 30, idempotency_key: time-check}
  then:
    status: 201
    body: {id: ANY_JOB_ID, submitted_at: 123456789, status: queued}
    db:
      - sql: SELECT COUNT(*) FROM jobs
        equals: 1
      - sql: SELECT COUNT(*) FROM events WHERE event_type = 'job_submitted'
        equals: 1
    events_added: 2  # D1: job_submitted + node_launched (scheduling runs in the request)

- id: JOB-GET-HAPPY
  endpoint: GET /jobs/{A}
  category: happy
  title: retrieve an existing queued job
  given:
    now_ts: 0
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30}
  when:
    - advance: {minutes: 1}
    - request: GET /jobs/{A}
  then:
    status: 200
    body: {id: {ref: A}, team: vision, gpus: 1, status: queued, submitted_at: 0, wait_seconds: 60}

- id: JOB-GET-NOT-FOUND
  endpoint: GET /jobs/does-not-exist
  category: not_found
  title: unknown job returns 404
  when:
    - request: GET /jobs/does-not-exist
  then: {status: 404}

- id: JOB-GET-WAIT-QUEUED
  endpoint: GET /jobs/{A}
  category: time
  title: queued wait_seconds grows with simulated time
  given:
    now_ts: 300
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, submitted_at: 60, sql: true}
  when:
    - request: GET /jobs/{A}
  then:
    status: 200
    body: {id: {ref: A}, status: queued, wait_seconds: 240}

- id: JOB-GET-WAIT-RUNNING
  endpoint: GET /jobs/{A}
  category: time
  title: running job wait_seconds is submission-to-start duration
  given:
    now_ts: 300
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, status: running, submitted_at: 0, started_at: 120, node: node-1, sql: true}
  when:
    - request: GET /jobs/{A}
  then:
    status: 200
    body: {id: {ref: A}, status: running, started_at: 120, wait_seconds: 120}

- id: JOB-GET-WAIT-FINISHED
  endpoint: GET /jobs/{A}
  category: time
  title: finished job preserves its actual queue wait duration
  given:
    now_ts: 600
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, status: succeeded, submitted_at: 0, started_at: 120, ended_at: 300, node: node-1, sql: true}
  when:
    - request: GET /jobs/{A}
  then:
    status: 200
    body: {id: {ref: A}, status: succeeded, wait_seconds: 120}

- id: JOB-GET-WAIT-CANCELLED-BEFORE-START
  endpoint: GET /jobs/{A}
  category: time
  title: cancelled-before-start wait_seconds ends at cancellation time
  given:
    now_ts: 300
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, status: cancelled, submitted_at: 0, ended_at: 300, sql: true}
  when:
    - request: GET /jobs/{A}
  then:
    status: 200
    body: {id: {ref: A}, status: cancelled, started_at: null, wait_seconds: 300}

- id: JOB-CANCEL-QUEUED
  endpoint: POST /jobs/{A}/cancel
  category: state
  title: cancel a queued job
  given:
    now_ts: 120
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30}
  when:
    - request: POST /jobs/{A}/cancel
  then:
    status: 200
    body: {id: {ref: A}, status: cancelled, ended_at: 120}
    events_added: 1

- id: JOB-CANCEL-RUNNING-LAST-ON-NODE
  endpoint: POST /jobs/{A}/cancel
  category: side_effect
  title: cancelling the last running job sets node idle_since to now
  given:
    now_ts: 300
    nodes:
      - {id: node-1, type: gpu-m, team: vision, state: ready, launched_at: 0, ready_at: 300, terminated_at: null, idle_since: null}
    jobs:
      - {ref: A, team: vision, gpus: 2, estimated_minutes: 30, status: running, submitted_at: 0, started_at: 120, node: node-1, sql: true}
  when:
    - request: POST /jobs/{A}/cancel
  then:
    status: 200
    body: {id: {ref: A}, status: cancelled, ended_at: 300}
    db:
      - sql: SELECT idle_since FROM nodes WHERE id = 'node-1'
        equals: 300
    events_added: 1

- id: JOB-CANCEL-RUNNING-NOT-LAST-ON-NODE
  endpoint: POST /jobs/{A}/cancel
  category: side_effect
  title: cancelling one of multiple running jobs does not mark node idle
  given:
    now_ts: 300
    nodes:
      - {id: node-1, type: gpu-m, team: vision, state: ready, launched_at: 0, ready_at: 300, terminated_at: null, idle_since: null}
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, status: running, submitted_at: 0, started_at: 100, node: node-1, sql: true}
      - {ref: B, team: vision, gpus: 2, estimated_minutes: 30, status: running, submitted_at: 10, started_at: 110, node: node-1, sql: true}
  when:
    - request: POST /jobs/{A}/cancel
  then:
    status: 200
    db:
      - sql: SELECT idle_since FROM nodes WHERE id = 'node-1'
        equals: null
    events_added: 1

- id: JOB-CANCEL-IDEMPOTENT-NOOP
  endpoint: POST /jobs/{A}/cancel
  category: idempotency
  title: cancelling an already cancelled job is a no-op
  given:
    now_ts: 300
    jobs:
      - {ref: A, team: vision, gpus: 1, estimated_minutes: 30, status: cancelled, submitted_at: 0, ended_at: 200, sql: true}
  when:
    - request: POST /jobs/{A}/cancel
  then:
    status: 200
    body: {id: {ref: A}, status: cancelled, ended_at: 200}
    events_added: 0

