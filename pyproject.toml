# Test settings only. Dependencies stay in requirements.txt.

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import broker` works with plain `pytest`,
# not only with `python -m pytest` (which adds the current directory).
pythonpath = ["."]
testpaths = ["tests"]
# The full-trace replay smoke test and the repeated concurrency stress tests;
# skip them with `pytest -m "not slow"`.
markers = ["slow: full-trace replay or repeated stress rounds (several seconds)"]
